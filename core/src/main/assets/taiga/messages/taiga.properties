###MOD (taiga town): texts of the taiga village on floor 0

###level
taiga.taigatownlevel.arrive=You climb out of the mine into the frosty air of the village.
taiga.taigatownlevel.amulet_title=The way out
taiga.taigatownlevel.amulet_body=Daylight shines down the mine shaft. With the Amulet of Yendor in your pack you could leave the dungeon behind for good... or just pay the village a visit first.
taiga.taigatownlevel.amulet_leave=Leave the dungeon (end the run)
taiga.taigatownlevel.amulet_village=Visit the village
taiga.taigatownlevel.forest_name=Dense taiga
taiga.taigatownlevel.forest_desc=Snow-laden spruces stand so close together that nobody could squeeze between them.
taiga.taigatownlevel.logs_name=Log wall
taiga.taigatownlevel.logs_desc=Thick pine logs, notched at the corners and caulked with moss. Warm light glows behind the frosted windows.
taiga.taigatownlevel.palisade_name=Palisade
taiga.taigatownlevel.palisade_desc=A wall of sharpened stakes keeps the wolves out of the village.
taiga.taigatownlevel.spruce_name=Spruce
taiga.taigatownlevel.spruce_desc=A young spruce bowing under a load of fresh snow.
taiga.taigatownlevel.festive_spruce_name=Festive spruce
taiga.taigatownlevel.festive_spruce_desc=The villagers have decorated this spruce with painted pine cones and a straw star.
taiga.taigatownlevel.woodpile_name=Woodpile
taiga.taigatownlevel.woodpile_desc=Split birch and pine, stacked for the long winter.
taiga.taigatownlevel.campfire_name=Campfire
taiga.taigatownlevel.campfire_desc=A crackling fire in a ring of stones. The villagers gather here in the evenings.
taiga.taigatownlevel.stream_name=Icy stream
taiga.taigatownlevel.stream_desc=Dark water hurries between the snowy banks, carrying thin plates of ice.
taiga.taigatownlevel.snow_name=Snow
taiga.taigatownlevel.snow_desc=Twigs, pine cones and the tracks of small animals are scattered over the snow.
taiga.taigatownlevel.grass_name=Dry grass
taiga.taigatownlevel.grass_desc=Last summer's grass pokes through the snow.
taiga.taigatownlevel.shrubs_name=Snowy shrubs
taiga.taigatownlevel.shrubs_desc=Juniper bushes buried in snow. Something could easily hide in them.
taiga.taigatownlevel.trampled_name=Trampled shrubs
taiga.taigatownlevel.planks_name=Plank floor
taiga.taigatownlevel.shaft_name=Mine shaft
taiga.taigatownlevel.shaft_desc=A ladder leads down into the old mine, and the mine leads down into the dungeon.
taiga.taigatownlevel.cauldron_name=Herbalist's cauldron
taiga.taigatownlevel.cauldron_desc=A big iron pot of bubbling green brew. The herbalist lets anyone use it for alchemy.

###traders
taiga.actors.towntrader.warn=Hey! Behave yourself, this is a peaceful village.
taiga.actors.furtrader.name=fur trader
taiga.actors.furtrader.desc=A burly man buried in furs from his hat down to his boots. He trades in warm clothes and in whatever gear the adventurers bring back up.
taiga.actors.furtrader.talk=Cold down there? Of course it is. Nobody goes into that mine without a good cloak on their back. Mine's the best fur this side of the river, and I'll give you a fair price for anything you drag back up.
taiga.actors.herbalist.name=herbalist
taiga.actors.herbalist.desc=An old woman in a green shawl who smells of mint and smoke. Bundles of dried herbs hang all over her cabin.
taiga.actors.herbalist.talk=Sit down, dearie, have some tea. Willow bark for the pain, rosehip for the cold... and if you find anything growing down in that pit, bring it to me. My cauldron is yours to use.
taiga.actors.hunter.name=hunter
taiga.actors.hunter.desc=A quiet woman in a grey hood with a quiver on her back. She sizes you up like she would a deer.
taiga.actors.hunter.talk=Wolves are bold this winter. Bring me their pelts and I'll pay. Resin works wonders, by the way: throw a lump at anything that chases you and watch it get stuck.

###villagers and animals
taiga.actors.villager.name=villager
taiga.actors.villager.desc=One of the folk of the village, wrapped up warm against the frost.
taiga.actors.villager.line_1=Mind the wolves past the palisade!
taiga.actors.villager.line_2=They say the mine goes all the way down to the demon halls.
taiga.actors.villager.line_3=Stay by the fire for a while, you look frozen.
taiga.actors.villager.line_4=The hunter pays good coin for wolf pelts.
taiga.actors.villager.line_5=My grandfather went down that shaft. He never came back up.
taiga.actors.villager.line_6=The herbalist's tea cures anything. Except stupidity.
taiga.actors.villager.line_7=Another adventurer? Good luck down there.
taiga.actors.villager.line_8=The snow hares are fat this year.
taiga.actors.villager.line_9=Don't let the husky beg, he's had three fish today.
taiga.actors.villager.line_10=Brr! Even the stream is freezing over.
taiga.actors.husky.name=husky
taiga.actors.husky.desc=A fluffy sled dog with ice-blue eyes and a curled tail. He seems to love everyone.
taiga.actors.husky.line_1=Woof!
taiga.actors.husky.line_2=*wags his tail*
taiga.actors.husky.line_3=*sniffs your pack for fish*
taiga.actors.husky.line_4=Awooo!
taiga.actors.reindeer.name=reindeer
taiga.actors.reindeer.desc=A tame reindeer with a bell around its neck, digging in the snow for lichen.
taiga.actors.reindeer.line_1=*chews lichen*
taiga.actors.reindeer.line_2=*snorts a cloud of steam*
taiga.actors.reindeer.line_3=*the bell jingles*
taiga.actors.wolf.name=wolf
taiga.actors.wolf.desc=A lean grey wolf. Hunger has driven it close to the village, but it won't pass the palisade.
taiga.actors.snowhare.name=snow hare
taiga.actors.snowhare.desc=A white hare, nearly invisible against the snow. It bolts at the slightest noise.

###items
taiga.items.smokedfish.name=smoked fish
taiga.items.smokedfish.desc=A whole grayling, smoked over juniper. Not a full meal, but tasty.
taiga.items.pinenutbread.name=pine nut bread
taiga.items.pinenutbread.desc=A dense loaf of rye bread baked with pine nuts. As filling as a ration.
taiga.items.herbaltea.name=herbal tea
taiga.items.herbaltea.ac_drink=DRINK
taiga.items.herbaltea.drink_msg=The hot tea warms you through and soothes your wounds.
taiga.items.herbaltea.desc=A flask of hot tea brewed from rosehip, thyme and willow bark. Drinking it slowly heals a little, drives out the cold and takes the edge off hunger.
taiga.items.wolfpelt.name=wolf pelt
taiga.items.wolfpelt.desc=A thick grey pelt. Any trader in the village will buy it.
taiga.items.pineresin.name=pine resin
taiga.items.pineresin.stuck=%s is stuck in the resin!
taiga.items.pineresin.desc=A sticky amber lump of pine resin. Thrown at a creature, it glues it to the ground for a few turns.
taiga.items.furcloak.name=fur cloak
taiga.items.furcloak.desc=A heavy cloak of wolf fur over a quilted jacket. It protects as well as leather armor, but is easier to wear.
taiga.items.mittens.name=fur mittens
taiga.items.mittens.desc=Padded mittens with a lining of chainmail rings. Quick like gloves, and they hit a little harder.
