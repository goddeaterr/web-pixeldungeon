###MOD (taiga town): Indonesian uses "_in" as its base bundle (see Messages.setup), English until translated

###level
taiga.taigatownlevel.arrive=You climb out of the mine into the frosty air of the village.
taiga.taigatownlevel.arrive_trail=You come down the Old Trail, back to the village.
taiga.taigatownlevel.amulet_title=The way out
taiga.taigatownlevel.amulet_body=Daylight shines down the mine shaft. With the Amulet of Yendor in your pack you could leave the dungeon behind for good... or just pay the village a visit first.
taiga.taigatownlevel.amulet_leave=Leave the dungeon (end the run)
taiga.taigatownlevel.amulet_village=Visit the village
taiga.taigatownlevel.forest_name=Dense taiga
taiga.taigatownlevel.forest_desc=Snow-laden spruces stand so close together that nobody could squeeze between them.
taiga.taigatownlevel.logs_name=Log wall
taiga.taigatownlevel.logs_desc=Thick pine logs, notched at the corners and caulked with moss. Warm light glows behind the frosted windows.
taiga.taigatownlevel.palisade_name=Palisade
taiga.taigatownlevel.palisade_desc=A wall of sharpened stakes keeps the wolves out of the village.
taiga.taigatownlevel.spruce_name=Spruce
taiga.taigatownlevel.spruce_desc=A young spruce bowing under a load of fresh snow.
taiga.taigatownlevel.festive_spruce_name=Festive spruce
taiga.taigatownlevel.festive_spruce_desc=The villagers have decorated this spruce with painted pine cones and a straw star.
taiga.taigatownlevel.woodpile_name=Woodpile
taiga.taigatownlevel.woodpile_desc=Split birch and pine, stacked for the long winter.
taiga.taigatownlevel.campfire_name=Campfire
taiga.taigatownlevel.campfire_desc=A crackling fire in a ring of stones. The villagers gather here in the evenings.
taiga.taigatownlevel.stream_name=Icy stream
taiga.taigatownlevel.stream_desc=Dark water hurries between the snowy banks, carrying thin plates of ice.
taiga.taigatownlevel.snow_name=Snow
taiga.taigatownlevel.snow_desc=Twigs, pine cones and the tracks of small animals are scattered over the snow.
taiga.taigatownlevel.grass_name=Dry grass
taiga.taigatownlevel.grass_desc=Last summer's grass pokes through the snow.
taiga.taigatownlevel.shrubs_name=Snowy shrubs
taiga.taigatownlevel.shrubs_desc=Juniper bushes buried in snow. Something could easily hide in them.
taiga.taigatownlevel.trampled_name=Trampled shrubs
taiga.taigatownlevel.planks_name=Plank floor
taiga.taigatownlevel.shaft_name=Mine shaft
taiga.taigatownlevel.shaft_desc=A ladder leads down into the old mine, and the mine leads down into the dungeon.
taiga.taigatownlevel.cauldron_name=Herbalist's cauldron
taiga.taigatownlevel.cauldron_desc=A big iron pot of bubbling green brew. The herbalist lets anyone use it for alchemy.

###traders
taiga.actors.towntrader.warn=Hey! Behave yourself, this is a peaceful village.
taiga.actors.furtrader.name=fur trader
taiga.actors.furtrader.desc=A burly man buried in furs from his hat down to his boots. He trades in warm clothes and in whatever gear the adventurers bring back up.
taiga.actors.furtrader.chat=Cold down there? Of course it is. Nobody goes into that mine without a good cloak on their back. Mine's the best fur this side of the river, and I'll give you a fair price for anything you drag back up.
taiga.actors.herbalist.name=herbalist
taiga.actors.herbalist.desc=An old woman in a green shawl who smells of mint and smoke. Bundles of dried herbs hang all over her cabin.
taiga.actors.herbalist.chat=Sit down, dearie, have some tea. Willow bark for the pain, rosehip for the cold... and if you find anything growing down in that pit, bring it to me. My cauldron is yours to use.
taiga.actors.hunter.name=hunter
taiga.actors.hunter.desc=A quiet woman in a grey hood with a quiver on her back. She sizes you up like she would a deer.
taiga.actors.hunter.chat=Wolves are bold this winter. Bring me their pelts and I'll pay. Resin works wonders, by the way: throw a lump at anything that chases you and watch it get stuck.

###villagers and animals
taiga.actors.villager.name=villager
taiga.actors.villager.desc=One of the folk of the village, wrapped up warm against the frost.
taiga.actors.villager.line_1=Mind the wolves past the palisade!
taiga.actors.villager.line_2=They say the mine goes all the way down to the demon halls.
taiga.actors.villager.line_3=Stay by the fire for a while, you look frozen.
taiga.actors.villager.line_4=The hunter pays good coin for wolf pelts.
taiga.actors.villager.line_5=My grandfather went down that shaft. He never came back up.
taiga.actors.villager.line_6=The herbalist's tea cures anything. Except stupidity.
taiga.actors.villager.line_7=Another adventurer? Good luck down there.
taiga.actors.villager.line_8=The snow hares are fat this year.
taiga.actors.villager.line_9=Don't let the husky beg, he's had three fish today.
taiga.actors.villager.line_10=Brr! Even the stream is freezing over.
taiga.actors.husky.name=husky
taiga.actors.husky.desc=A fluffy sled dog with ice-blue eyes and a curled tail. He seems to love everyone.
taiga.actors.husky.line_1=Woof!
taiga.actors.husky.line_2=*wags his tail*
taiga.actors.husky.line_3=*sniffs your pack for fish*
taiga.actors.husky.line_4=Awooo!
taiga.actors.reindeer.name=reindeer
taiga.actors.reindeer.desc=A tame reindeer with a bell around its neck, digging in the snow for lichen.
taiga.actors.reindeer.line_1=*chews lichen*
taiga.actors.reindeer.line_2=*snorts a cloud of steam*
taiga.actors.reindeer.line_3=*the bell jingles*
taiga.actors.wolf.name=wolf
taiga.actors.wolf.desc=A lean grey wolf. Hunger has driven it close to the village, but it won't pass the palisade.
taiga.actors.snowhare.name=snow hare
taiga.actors.snowhare.desc=A white hare, nearly invisible against the snow. It bolts at the slightest noise.

###items
taiga.items.smokedfish.name=smoked fish
taiga.items.smokedfish.desc=A whole grayling, smoked over juniper. Not a full meal, but tasty.
taiga.items.pinenutbread.name=pine nut bread
taiga.items.pinenutbread.desc=A dense loaf of rye bread baked with pine nuts. As filling as a ration.
taiga.items.herbaltea.name=herbal tea
taiga.items.herbaltea.ac_drink=DRINK
taiga.items.herbaltea.drink_msg=The hot tea warms you through and soothes your wounds.
taiga.items.herbaltea.desc=A flask of hot tea brewed from rosehip, thyme and willow bark. Drinking it slowly heals a little, drives out the cold and takes the edge off hunger.
taiga.items.wolfpelt.name=wolf pelt
taiga.items.wolfpelt.desc=A thick grey pelt. Any trader in the village will buy it.
taiga.items.pineresin.name=pine resin
taiga.items.pineresin.stuck=%s is stuck in the resin!
taiga.items.pineresin.desc=A sticky amber lump of pine resin. Thrown at a creature, it glues it to the ground for a few turns.
taiga.items.furcloak.name=fur cloak
taiga.items.furcloak.desc=A heavy cloak of wolf fur over a quilted jacket. It protects as well as leather armor, but is easier to wear.
taiga.items.mittens.name=fur mittens
taiga.items.mittens.desc=Padded mittens with a lining of chainmail rings. Quick like gloves, and they hit a little harder.

###the trail up and the taiga floors
taiga.taigatownlevel.trail_up_name=Old Trail
taiga.taigatownlevel.trail_up_desc=Stone steps marked with red ribbons climb out of the clearing. This is the Old Trail: it leads up into the taiga, toward the mountains.
taiga.taigatownlevel.trail_down_name=Trail down
taiga.taigatownlevel.trail_down_desc=The trail winds back down the slope, toward the village.
taiga.taigabranch.climbing=Climbing...
taiga.taigabranch.waking=Awakening...
taiga.taigabranch.going_down=Heading down...
taiga.taigabranch.arrive=You climb to %s.
taiga.taigabranch.return=You return to %s.
taiga.taigabranch.floor_1=the Old Trail
taiga.taigabranch.floor_2=the Deep Taiga
taiga.taigabranch.floor_3=the Frozen Lakes
taiga.taigabranch.floor_4=the Shaman's Hills
taiga.taigabranch.floor_5=the Leshy's Grove
taiga.taigabranch.floor_6=the Last Hearth
taiga.taigabranch.floor_7=the Drowned Path
taiga.taigabranch.floor_8=the Snowy Swamp
taiga.taigabranch.floor_9=the Forgotten Graves
taiga.taigabranch.floor_10=the Sunken Graveyard
taiga.taigabranch.swamp_intro=Beyond the Leshy's grove stands the Last Hearth. Its people buried their dead uphill until darkness woke them. Now the graves creep toward the village. Cross the snowy swamp and find who is calling the dead.
taiga.taigabranch.flavor_6=Only two shops still open their shutters. Beyond the village, crooked stones disappear beneath black water and blowing snow.
taiga.taigabranch.flavor_7=The road has sunk into the marsh. Snow runs sideways in the wind, and the footprints ahead end at a grave.
taiga.taigabranch.flavor_8=Dark water reflects a sky without color. There are fewer trees here, and none carry birdsong.
taiga.taigabranch.flavor_9=Names fade from the stones. The wind sounds almost like the voices of those buried beneath them.
taiga.taigabranch.flavor_10=The last graves have collapsed into the swamp. A watcher waits where the dead were meant to rest.
taiga.taigatownlevel.intro=You wake beside the village fire. The mine shaft has been barred: no one who went below has returned, and its lock will answer only to a relic hidden beyond the twenty-fifth height. The corruption is climbing through the mountain's roots, killing each settlement above the last. Follow the trail uphill, learn what is feeding it, and bring back the relic before this final hearth goes dark.
taiga.actors.gravewarden.name=grave warden
taiga.actors.gravewarden.desc=The keeper of the sunken graveyard still calls the dead to their places. The graves have vanished, but the command remains.
taiga.actors.gravewarden.notice=Back to your graves. All of you.
taiga.actors.gravewarden.defeated=The voices stop. Beyond the drowned graves, the mountain is bare and grey; the corruption climbed farther still.
taiga.levels.gravestones.name=Weathered headstone
taiga.levels.gravestones.desc=Its inscription has been worn smooth by years of wind and freezing rain.
taiga.taigabranch.flavor_1=The trail winds up between ancient spruces. Ever since the dark energy began rising from the dungeon, winter here has never ended. Somewhere ahead, wolves are howling.
taiga.taigabranch.flavor_2=The forest closes in around you. Thin smoke rises from a campfire somewhere among the trees.
taiga.taigabranch.flavor_3=Ice-bound lakes glitter between the trees. They say a one-eyed wolf leads the biggest pack of the taiga here.
taiga.taigabranch.flavor_4=Carved spirit poles watch you from the hills. The air hums with something old and angry.
taiga.taigabranch.flavor_5=The trees here are older than the village, older than the city below. The whole forest seems to hold its breath.
taiga.levels.taigabosslevel.spruce_desc=An ancient spruce, its bark grown over with moss. It feels as if it is watching you.

###beasts of the taiga
taiga.actors.frostwolf.name=frost wolf
taiga.actors.frostwolf.desc=A big pale wolf of the deep taiga, its fur rimed with frost. Frost wolves hunt in packs and are not afraid of people any more.
taiga.actors.oneeyedalpha.name=One-Eyed Alpha
taiga.actors.oneeyedalpha.desc=The leader of the great pack of the taiga: a huge dark wolf with one blind eye and one burning red one. Trappers have hunted it for years.
taiga.actors.oneeyedalpha.notice=*the alpha bares its fangs and growls*
taiga.actors.oneeyedalpha.howl=*a long howl rolls through the forest*
taiga.actors.wildboar.name=wild boar
taiga.actors.wildboar.desc=A bristly boar with yellowed tusks. Once it has seen you, it charges at twice its usual speed.
taiga.actors.icewisp.name=ice wisp
taiga.actors.icewisp.desc=A small spirit of the frost, glowing like moonlight on snow. The winter that never ends has turned the wisps of the taiga hostile. It spits shards of ice that chill whatever they hit.
taiga.actors.icewisp.bolt_kill=The ice shard pierced your heart...
taiga.actors.frostbitten.name=frostbitten
taiga.actors.frostbitten.desc=A traveller who froze to death in the taiga and got up again. Icicles hang from its beard, and its touch chills to the bone.
taiga.actors.brownbear.name=brown bear
taiga.actors.brownbear.desc=A huge brown bear, roused from its winter sleep by the endless cold. It is hungry, and very, very angry. Best let it sleep.
taiga.actors.sprucetreant.name=spruce treant
taiga.actors.sprucetreant.desc=A spruce that has woken up and walks. Its roots seize whatever it strikes.
taiga.actors.sprucetreant.disguise_name=spruce
taiga.actors.sprucetreant.disguise_desc=A young spruce bowing under a load of snow. Was it standing there a moment ago?
taiga.actors.sprucetreant.awakens=The spruce opens its amber eyes!
taiga.actors.whitestag.name=white stag
taiga.actors.whitestag.desc=A stag with a snow-white coat and silver antlers. The villagers say it is the Leshy's own messenger, and that whoever catches it will be swift as the wind.
taiga.actors.goldensable.name=golden sable
taiga.actors.goldensable.desc=A sable with fur like poured gold. Its pelt would fetch a small fortune in the village, if you can ever catch it.
taiga.actors.corruptedtotem.name=corrupted totem
taiga.actors.corruptedtotem.desc=A carved spirit pole. The shamans once raised these to protect the hills, but the Leshy's anger has turned them sour: while anyone is near, they keep calling ice wisps.
taiga.actors.corruptedtotem.summon=summons
taiga.actors.corruptedtotem.broken=The totem cracks apart and a cold spirit flies free. (%1$d of %2$d totems broken)

###the Leshy
taiga.actors.leshy.name=Leshy
taiga.actors.leshy.desc=The lord of the taiga: a giant of wood and moss crowned with antlers, his eyes burning green. For centuries he kept the balance of the forest. The dark energy rising from the dungeon has driven him mad, and now he turns the whole taiga against everything that walks in it.
taiga.actors.leshy.notice=WHO WALKS IN MY GROVE? The forest remembers every axe... and every footstep!
taiga.actors.leshy.roots_warn=The ground around you begins to stir!
taiga.actors.leshy.roots_kill=You were torn apart by the roots of the taiga...
taiga.actors.leshy.tree_warn=An ancient spruce creaks and begins to fall!
taiga.actors.leshy.tree_kill=You were crushed by a falling spruce...
taiga.actors.leshy.step=The Leshy steps into a spruce and out of another!
taiga.actors.leshy.howl=Come, my wolves!
taiga.actors.leshy.phase2=Then let the winter take you! Wake, my children!
taiga.actors.leshy.defeated=The... forest... remembers... you...

###quest givers
taiga.actors.trapper.name=old trapper
taiga.actors.trapper.desc=A grizzled trapper in a fur hat with ear flaps, warming his hands at a small fire. A coil of rope and a few rusty traps hang from his belt.
taiga.actors.trapper.intro=Well, a face that isn't a wolf's. Sit, sit.\n\nI've trapped this taiga for forty winters, but this one's wrong. It never ends. And the wolves... there's a pack up by the frozen lakes, led by a one-eyed brute as big as a pony. It took my traps, my dog, nearly took me.\n\nKill the One-Eyed Alpha and bring me its fang. I'm too old to do it, but I'll make it worth your while.
taiga.actors.trapper.reminder=The One-Eyed Alpha prowls the frozen lakes, further up the trail. Bring me its fang.
taiga.actors.trapper.reward=You did it! That's the brute's fang all right. Here, take your pick, these served me well.
taiga.actors.trapper.thanks=May the taiga be kind to you, friend.
taiga.actors.trapper.farewell=Without the alpha the pack has scattered. I'll sleep well tonight, thanks to you. Watch out for the Leshy further up... they say he's gone mad.
taiga.actors.shaman.name=old shaman
taiga.actors.shaman.desc=An old woman wrapped in a red robe sewn with beads and bells, an antlered headdress on her white hair. Her eyes are calm, but very tired.
taiga.actors.shaman.intro=I saw you coming in the smoke, child of the deep.\n\nThe Leshy, master of this forest, has lost his mind to the darkness rising from below. His anger has soured even our spirit poles: three corrupted totems stand on these hills, calling the frost spirits against the living.\n\nBreak the three totems and free the spirits trapped in them. Then come back to my fire.
taiga.actors.shaman.reminder=The spirits are still trapped. %1$d of %2$d totems are broken.
taiga.actors.shaman.reward=The spirits are free, I can feel them dancing in the wind. Choose a gift, child; the spirits wanted you to have one of these.
taiga.actors.shaman.thanks=Go with the spirits.
taiga.actors.shaman.farewell=The hills are quieter now. Only the Leshy remains, in his grove at the top of the trail. Calm him if you can... and if you cannot, end his suffering.

###items of the taiga floors
taiga.items.frostjavelin.name=frost javelin
taiga.items.frostjavelin.desc=A light javelin tipped with frozen iron, made by the old trapper. It chills whatever it strikes.
taiga.items.trapperknife.name=trapper's knife
taiga.items.trapperknife.desc=The old trapper's broad skinning knife. It deals half again as much damage to the beasts of the taiga.
taiga.items.bearskincoat.name=bearskin coat
taiga.items.bearskincoat.desc=A long coat of thick bear fur. It protects like mail armor, but is a bit easier to wear.
taiga.items.bearclaw.name=bear claw
taiga.items.bearclaw.desc=A gauntlet set with a brown bear's claws. As quick as a sai, and the wounds it tears often keep bleeding.
taiga.items.woodcutteraxe.name=woodcutter's axe
taiga.items.woodcutteraxe.desc=A heavy, well-kept axe. Its owner froze in the taiga long ago, but the blade is as sharp as ever, and it bites deep into living wood.
taiga.items.spiritstaff.name=spirit staff
taiga.items.spiritstaff.desc=The shaman's staff, hung with bells, beads and small bones. Its blows carry the cold of the spirits and often chill the target.
taiga.items.leshycrook.name=Leshy's crook
taiga.items.leshycrook.desc=The crook of the lord of the taiga, still alive and growing green shoots. It has a long reach, and roots often seize whatever it strikes.
taiga.items.heartofthetaiga.name=Heart of the Taiga
taiga.items.heartofthetaiga.ac_absorb=ABSORB
taiga.items.heartofthetaiga.absorb_msg=The warmth of the whole forest flows through you.
taiga.items.heartofthetaiga.status=+%d max HP
taiga.items.heartofthetaiga.desc=The Leshy's heart: a lump of glowing amber with green fire inside. Taking it in grants lasting vitality: _+10 maximum health_, forever.
taiga.items.elixirofthestag.name=elixir of the stag
taiga.items.elixirofthestag.drink_msg=You feel swift and light as a stag.
taiga.items.elixirofthestag.desc=A shimmering silver draught, left behind by the white stag. Drinking it makes you very fast for a short while, and blessed for much longer.
taiga.items.elixirofthenorth.name=elixir of the north
taiga.items.elixirofthenorth.drink_msg=A warm glow spreads through your body.
taiga.items.elixirofthenorth.desc=The shaman's brew of cloudberry, bark and spirit-smoke. It heals over time and keeps the cold away: no chill or freezing for a long time.
taiga.items.elixirofthenorth$frostward.name=Warmth of the north
taiga.items.elixirofthenorth$frostward.desc=The shaman's elixir keeps you warm: you can't be chilled or frozen.\n\nTurns remaining: %s.
taiga.items.alphafang.name=alpha's fang
taiga.items.alphafang.desc=A huge yellowed fang of the One-Eyed Alpha. The old trapper will want to see this.
taiga.items.bearpelt.name=bear pelt
taiga.items.bearpelt.desc=A thick brown bear pelt. The traders in the village pay well for these.
taiga.items.sablepelt.name=golden sable pelt
taiga.items.sablepelt.desc=The pelt of the golden sable, soft and shimmering. Worth a small fortune in the village.
### Grey Orchard, +11 to +16
taiga.taigatownlevel.begin=You wake beside the village fire. The mine is barred; the mountain trail is your only way forward.
taiga.taigatownlevel.shaft_sealed=The mine gate will open only to a relic from beyond the twenty-fifth height.
taiga.taigatownlevel.sealed_shaft_name=sealed mine shaft
taiga.taigatownlevel.sealed_shaft_desc=Iron bars cross the mine ladder. A socket in the lock waits for a relic from the summit. The villagers will not open it before you return.
taiga.taigabranch.floor_11=the Ashen Waystation
taiga.taigabranch.floor_12=the Dead Rows
taiga.taigabranch.floor_13=the Broken Glasshouses
taiga.taigabranch.floor_14=the Orchard of Silence
taiga.taigabranch.floor_15=the Conservatory
taiga.taigabranch.floor_16=the Empty Watch
taiga.taigabranch.orchard_intro=Past the graveyard, the road reaches an orchard that once fed every settlement on the mountain. The gardeners tried to keep its trees alive under glass. When the roots drank the corruption, the fruit blackened and the glass kept the dead inside. One porter still waits at the waystation. Find the keeper of the conservatory, then follow the wind higher.
taiga.taigabranch.highland_intro=There is no orchard beyond the conservatory, only an abandoned watch post and a road worn almost smooth by the wind. The last message scratched into its wall says that the blight came from above as well as below. Ice and fallen stone block the ridge; for now, the only open road leads back through the orchard.
taiga.taigabranch.flavor_11=The last porter tends a thin flame under a shattered roof. Rows of bare trees begin just beyond the station.
taiga.taigabranch.flavor_12=The trees stand in straight lines, as if they could still bear fruit. Ash drifts between their roots.
taiga.taigabranch.flavor_13=Broken panes cover the ground. Something taps on the surviving glass from inside.
taiga.taigabranch.flavor_14=No leaf remains. Even the wind seems reluctant to enter these rows.
taiga.taigabranch.flavor_15=A dim figure moves behind the conservatory walls, tending plants that died long ago.
taiga.taigabranch.flavor_16=The orchard falls away below. Ahead, a shuttered watch post faces a lifeless ridge.
taiga.actors.orchardmerchant.name=last orchard porter
taiga.actors.orchardmerchant.desc=A bandaged porter keeps the waystation shop open beneath a broken glass roof. His supplies include ordinary dungeon gear and what little the orchard still yields.
taiga.actors.orchardmerchant.chat=The fruit died first. Then the gardeners kept pruning empty branches, as if the harvest might come back. The one in the high glasshouse still hasn't stopped. Take what you need; the ridge above is colder than this place.
taiga.actors.ashgardener.name=ash gardener
taiga.actors.ashgardener.desc=A dead keeper in a soot-black coat. Its shears have fused with its hands, and it cuts at anything moving between the rows.
taiga.actors.glassmoth.name=glass moth
taiga.actors.glassmoth.desc=An insect with thin translucent wings. A flash of light follows every stroke, even under this dead sky.
taiga.actors.hollowscarecrow.name=hollow scarecrow
taiga.actors.hollowscarecrow.desc=A wire and timber frame wearing the last scraps of a gardener's coat. It guards the fruitless trees with heavy iron hooks.
taiga.actors.glassconservator.name=glass conservator
taiga.actors.glassconservator.desc=The orchard's final keeper sealed itself inside the conservatory. Its glass and metal body still follows the old instructions: tend, cut, preserve.
taiga.actors.glassconservator.notice=The rows must be kept. Stand still.
taiga.actors.glassconservator.phase=The keeper pulls broken panes into a brighter, faster frame!
taiga.actors.glassconservator.warning_row=Light gathers across your row. Move to another row!
taiga.actors.glassconservator.warning_column=Light gathers along your column. Move aside!
taiga.actors.glassconservator.shatter=The line of glass light cuts through you!
taiga.actors.glassconservator.dodged=Glass light strikes the place you just left.
taiga.actors.glassconservator.defeated=The conservatory falls silent. The last orchard keeper will prune no more.
taiga.items.ashglassshard.name=ashglass shard
taiga.items.ashglassshard.desc=A sliver of dark conservatory glass. Thrown at an enemy, it cuts and leaves a blinding flash.
taiga.items.blackfruit.name=black fruit
taiga.items.blackfruit.desc=A shrivelled orchard fruit preserved by frost and ash. It gives a little nourishment, but chills you when eaten.
taiga.items.glasssickle.name=glass sickle
taiga.items.glasssickle.desc=A curved pruning blade lined with hard ashglass. Its edge bites especially deeply into lifeless constructs.
taiga.items.conservatorshears.name=conservator's shears
taiga.items.conservatorshears.desc=The keeper's paired pruning blades are set with broken conservatory glass. A strike can scatter a flash that blinds its target.
taiga.levels.highlandoutpostlevel.closed_name=shuttered ridge trail
taiga.levels.highlandoutpostlevel.closed_desc=Ice and fallen stone block the ridge beyond the watch post. The southern road back through the orchard remains open.
taiga.levels.orchardterrain.glasswall_name=broken glass wall
taiga.levels.orchardterrain.glasswall_desc=Iron ribs hold up a few smoke-dark panes. The rest lie in shards on the ground.
taiga.levels.orchardterrain.timber_name=rotting frame
taiga.levels.orchardterrain.timber_desc=Dry, black timber from an abandoned orchard shed.
taiga.levels.orchardterrain.effigy_name=iron trellis
taiga.levels.orchardterrain.effigy_desc=An empty iron frame where vines once climbed under glass.
taiga.levels.orchardterrain.cistern_name=dark cistern
taiga.levels.orchardterrain.cistern_desc=Cold water reflects bare branches and broken panes.
taiga.levels.orchardterrain.ash_name=ashen soil
taiga.levels.orchardterrain.ash_desc=The soil is grey and powdery. Nothing living has taken root here in years.
taiga.levels.orchardterrain.flagstones_name=old flagstones
taiga.levels.orchardterrain.flagstones_desc=Stone paths laid between planting rows, worn smooth by absent feet.
taiga.levels.orchardterrain.tree_name=dead fruit tree
taiga.levels.orchardterrain.tree_desc=A black trunk with bare, carefully pruned branches. There is no bud or bird on it.
taiga.levels.orchardterrain.up_name=road uphill
taiga.levels.orchardterrain.up_desc=The path climbs toward the conservatory and the empty ridge beyond.
taiga.levels.orchardterrain.down_name=road downhill
taiga.levels.orchardterrain.down_desc=The path winds back toward the drowned graveyard.
taiga.levels.taigabosslevel.spruce_desc=An ancient spruce, its bark grown over with moss. It feels as if it is watching you.

###beasts of the taiga
taiga.actors.frostwolf.name=frost wolf
taiga.actors.frostwolf.desc=A big pale wolf of the deep taiga, its fur rimed with frost. Frost wolves hunt in packs and are not afraid of people any more.
taiga.actors.oneeyedalpha.name=One-Eyed Alpha
taiga.actors.oneeyedalpha.desc=The leader of the great pack of the taiga: a huge dark wolf with one blind eye and one burning red one. Trappers have hunted it for years.
taiga.actors.oneeyedalpha.notice=*the alpha bares its fangs and growls*
taiga.actors.oneeyedalpha.howl=*a long howl rolls through the forest*
taiga.actors.wildboar.name=wild boar
taiga.actors.wildboar.desc=A bristly boar with yellowed tusks. Once it has seen you, it charges at twice its usual speed.
taiga.actors.icewisp.name=ice wisp
taiga.actors.icewisp.desc=A small spirit of the frost, glowing like moonlight on snow. The winter that never ends has turned the wisps of the taiga hostile. It spits shards of ice that chill whatever they hit.
taiga.actors.icewisp.bolt_kill=The ice shard pierced your heart...
taiga.actors.frostbitten.name=frostbitten
taiga.actors.frostbitten.desc=A traveller who froze to death in the taiga and got up again. Icicles hang from its beard, and its touch chills to the bone.
taiga.actors.brownbear.name=brown bear
taiga.actors.brownbear.desc=A huge brown bear, roused from its winter sleep by the endless cold. It is hungry, and very, very angry. Best let it sleep.
taiga.actors.sprucetreant.name=spruce treant
taiga.actors.sprucetreant.desc=A spruce that has woken up and walks. Its roots seize whatever it strikes.
taiga.actors.sprucetreant.disguise_name=spruce
taiga.actors.sprucetreant.disguise_desc=A young spruce bowing under a load of snow. Was it standing there a moment ago?
taiga.actors.sprucetreant.awakens=The spruce opens its amber eyes!
taiga.actors.whitestag.name=white stag
taiga.actors.whitestag.desc=A stag with a snow-white coat and silver antlers. The villagers say it is the Leshy's own messenger, and that whoever catches it will be swift as the wind.
taiga.actors.goldensable.name=golden sable
taiga.actors.goldensable.desc=A sable with fur like poured gold. Its pelt would fetch a small fortune in the village, if you can ever catch it.
taiga.actors.corruptedtotem.name=corrupted totem
taiga.actors.corruptedtotem.desc=A carved spirit pole. The shamans once raised these to protect the hills, but the Leshy's anger has turned them sour: while anyone is near, they keep calling ice wisps.
taiga.actors.corruptedtotem.summon=summons
taiga.actors.corruptedtotem.broken=The totem cracks apart and a cold spirit flies free. (%1$d of %2$d totems broken)

###the Leshy
taiga.actors.leshy.name=Leshy
taiga.actors.leshy.desc=The lord of the taiga: a giant of wood and moss crowned with antlers, his eyes burning green. For centuries he kept the balance of the forest. The dark energy rising from the dungeon has driven him mad, and now he turns the whole taiga against everything that walks in it.
taiga.actors.leshy.notice=WHO WALKS IN MY GROVE? The forest remembers every axe... and every footstep!
taiga.actors.leshy.roots_warn=The ground around you begins to stir!
taiga.actors.leshy.roots_kill=You were torn apart by the roots of the taiga...
taiga.actors.leshy.tree_warn=An ancient spruce creaks and begins to fall!
taiga.actors.leshy.tree_kill=You were crushed by a falling spruce...
taiga.actors.leshy.step=The Leshy steps into a spruce and out of another!
taiga.actors.leshy.howl=Come, my wolves!
taiga.actors.leshy.phase2=Then let the winter take you! Wake, my children!
taiga.actors.leshy.defeated=The... forest... remembers... you...

###quest givers
taiga.actors.trapper.name=old trapper
taiga.actors.trapper.desc=A grizzled trapper in a fur hat with ear flaps, warming his hands at a small fire. A coil of rope and a few rusty traps hang from his belt.
taiga.actors.trapper.intro=Well, a face that isn't a wolf's. Sit, sit.\n\nI've trapped this taiga for forty winters, but this one's wrong. It never ends. And the wolves... there's a pack up by the frozen lakes, led by a one-eyed brute as big as a pony. It took my traps, my dog, nearly took me.\n\nKill the One-Eyed Alpha and bring me its fang. I'm too old to do it, but I'll make it worth your while.
taiga.actors.trapper.reminder=The One-Eyed Alpha prowls the frozen lakes, further up the trail. Bring me its fang.
taiga.actors.trapper.reward=You did it! That's the brute's fang all right. Here, take your pick, these served me well.
taiga.actors.trapper.thanks=May the taiga be kind to you, friend.
taiga.actors.trapper.farewell=Without the alpha the pack has scattered. I'll sleep well tonight, thanks to you. Watch out for the Leshy further up... they say he's gone mad.
taiga.actors.shaman.name=old shaman
taiga.actors.shaman.desc=An old woman wrapped in a red robe sewn with beads and bells, an antlered headdress on her white hair. Her eyes are calm, but very tired.
taiga.actors.shaman.intro=I saw you coming in the smoke, child of the deep.\n\nThe Leshy, master of this forest, has lost his mind to the darkness rising from below. His anger has soured even our spirit poles: three corrupted totems stand on these hills, calling the frost spirits against the living.\n\nBreak the three totems and free the spirits trapped in them. Then come back to my fire.
taiga.actors.shaman.reminder=The spirits are still trapped. %1$d of %2$d totems are broken.
taiga.actors.shaman.reward=The spirits are free, I can feel them dancing in the wind. Choose a gift, child; the spirits wanted you to have one of these.
taiga.actors.shaman.thanks=Go with the spirits.
taiga.actors.shaman.farewell=The hills are quieter now. Only the Leshy remains, in his grove at the top of the trail. Calm him if you can... and if you cannot, end his suffering.

###items of the taiga floors
taiga.items.frostjavelin.name=frost javelin
taiga.items.frostjavelin.desc=A light javelin tipped with frozen iron, made by the old trapper. It chills whatever it strikes.
taiga.items.trapperknife.name=trapper's knife
taiga.items.trapperknife.desc=The old trapper's broad skinning knife. It deals half again as much damage to the beasts of the taiga.
taiga.items.bearskincoat.name=bearskin coat
taiga.items.bearskincoat.desc=A long coat of thick bear fur. It protects like mail armor, but is a bit easier to wear.
taiga.items.bearclaw.name=bear claw
taiga.items.bearclaw.desc=A gauntlet set with a brown bear's claws. As quick as a sai, and the wounds it tears often keep bleeding.
taiga.items.woodcutteraxe.name=woodcutter's axe
taiga.items.woodcutteraxe.desc=A heavy, well-kept axe. Its owner froze in the taiga long ago, but the blade is as sharp as ever, and it bites deep into living wood.
taiga.items.spiritstaff.name=spirit staff
taiga.items.spiritstaff.desc=The shaman's staff, hung with bells, beads and small bones. Its blows carry the cold of the spirits and often chill the target.
taiga.items.leshycrook.name=Leshy's crook
taiga.items.leshycrook.desc=The crook of the lord of the taiga, still alive and growing green shoots. It has a long reach, and roots often seize whatever it strikes.
taiga.items.heartofthetaiga.name=Heart of the Taiga
taiga.items.heartofthetaiga.ac_absorb=ABSORB
taiga.items.heartofthetaiga.absorb_msg=The warmth of the whole forest flows through you.
taiga.items.heartofthetaiga.status=+%d max HP
taiga.items.heartofthetaiga.desc=The Leshy's heart: a lump of glowing amber with green fire inside. Taking it in grants lasting vitality: _+10 maximum health_, forever.
taiga.items.elixirofthestag.name=elixir of the stag
taiga.items.elixirofthestag.drink_msg=You feel swift and light as a stag.
taiga.items.elixirofthestag.desc=A shimmering silver draught, left behind by the white stag. Drinking it makes you very fast for a short while, and blessed for much longer.
taiga.items.elixirofthenorth.name=elixir of the north
taiga.items.elixirofthenorth.drink_msg=A warm glow spreads through your body.
taiga.items.elixirofthenorth.desc=The shaman's brew of cloudberry, bark and spirit-smoke. It heals over time and keeps the cold away: no chill or freezing for a long time.
taiga.items.elixirofthenorth$frostward.name=Warmth of the north
taiga.items.elixirofthenorth$frostward.desc=The shaman's elixir keeps you warm: you can't be chilled or frozen.\n\nTurns remaining: %s.
taiga.items.alphafang.name=alpha's fang
taiga.items.alphafang.desc=A huge yellowed fang of the One-Eyed Alpha. The old trapper will want to see this.
taiga.items.bearpelt.name=bear pelt
taiga.items.bearpelt.desc=A thick brown bear pelt. The traders in the village pay well for these.
taiga.items.sablepelt.name=golden sable pelt
taiga.items.sablepelt.desc=The pelt of the golden sable, soft and shimmering. Worth a small fortune in the village.
