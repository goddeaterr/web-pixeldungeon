###MOD (taiga town): тексты таёжной деревни на этаже 0

###level
taiga.taigatownlevel.arrive=Вы выбираетесь из шахты на морозный воздух деревни.
taiga.taigatownlevel.arrive_trail=Вы спускаетесь по Старой тропе обратно в деревню.
taiga.taigatownlevel.amulet_title=Путь наверх
taiga.taigatownlevel.amulet_body=В шахту падает дневной свет. С Амулетом Йендора в сумке можно навсегда покинуть подземелье... или сначала заглянуть в деревню.
taiga.taigatownlevel.amulet_leave=Покинуть подземелье (конец игры)
taiga.taigatownlevel.amulet_village=Зайти в деревню
taiga.taigatownlevel.forest_name=Густая тайга
taiga.taigatownlevel.forest_desc=Заснеженные ели стоят так плотно, что между ними никому не протиснуться.
taiga.taigatownlevel.logs_name=Бревенчатая стена
taiga.taigatownlevel.logs_desc=Толстые сосновые брёвна, срубленные в угол и проконопаченные мхом. За заиндевевшими окнами горит тёплый свет.
taiga.taigatownlevel.palisade_name=Частокол
taiga.taigatownlevel.palisade_desc=Стена из заострённых кольев не пускает волков в деревню.
taiga.taigatownlevel.spruce_name=Ель
taiga.taigatownlevel.spruce_desc=Молодая ель гнётся под шапкой свежего снега.
taiga.taigatownlevel.festive_spruce_name=Нарядная ель
taiga.taigatownlevel.festive_spruce_desc=Деревенские украсили эту ель расписными шишками и соломенной звездой.
taiga.taigatownlevel.woodpile_name=Поленница
taiga.taigatownlevel.woodpile_desc=Колотые берёзовые и сосновые дрова, сложенные на долгую зиму.
taiga.taigatownlevel.campfire_name=Костёр
taiga.taigatownlevel.campfire_desc=Потрескивающий костёр в кольце из камней. По вечерам здесь собирается вся деревня.
taiga.taigatownlevel.stream_name=Ледяной ручей
taiga.taigatownlevel.stream_desc=Тёмная вода бежит между снежными берегами, неся тонкие льдинки.
taiga.taigatownlevel.snow_name=Снег
taiga.taigatownlevel.snow_desc=По снегу разбросаны ветки, шишки и следы мелких зверьков.
taiga.taigatownlevel.grass_name=Сухая трава
taiga.taigatownlevel.grass_desc=Из-под снега торчит прошлогодняя трава.
taiga.taigatownlevel.shrubs_name=Заснеженные кусты
taiga.taigatownlevel.shrubs_desc=Можжевельник, засыпанный снегом. В нём легко спрятаться.
taiga.taigatownlevel.trampled_name=Примятые кусты
taiga.taigatownlevel.planks_name=Дощатый пол
taiga.taigatownlevel.shaft_name=Шахта
taiga.taigatownlevel.shaft_desc=Лестница ведёт вниз, в старую шахту, а шахта ведёт в подземелье.
taiga.taigatownlevel.cauldron_name=Котёл травницы
taiga.taigatownlevel.cauldron_desc=Большой чугунный котёл с бурлящим зелёным варевом. Травница разрешает всем пользоваться им для алхимии.

###traders
taiga.actors.towntrader.warn=Эй! Ведите себя прилично, у нас мирная деревня.
taiga.actors.furtrader.name=торговец мехами
taiga.actors.furtrader.desc=Здоровяк, укутанный в меха от шапки до сапог. Торгует тёплой одеждой и всем снаряжением, которое приносят снизу искатели приключений.
taiga.actors.furtrader.chat=Холодно там внизу? Ещё бы. Никто не лезет в эту шахту без доброго плаща на плечах. Лучше моих мехов на этом берегу не найдёшь, а за всё, что вытащишь наверх, дам честную цену.
taiga.actors.herbalist.name=травница
taiga.actors.herbalist.desc=Старушка в зелёной шали, пахнущая мятой и дымом. Вся её изба увешана пучками сушёных трав.
taiga.actors.herbalist.chat=Присядь, милок, выпей чаю. Ивовая кора от боли, шиповник от простуды... А если найдёшь что-то растущее в той яме, неси мне. Котёл в твоём распоряжении.
taiga.actors.hunter.name=охотница
taiga.actors.hunter.desc=Молчаливая женщина в сером капюшоне, с колчаном за спиной. Она оценивает вас взглядом, как оленя.
taiga.actors.hunter.chat=Волки нынче осмелели. Принеси мне их шкуры, я заплачу. И кстати, смола творит чудеса: брось комок в того, кто за тобой гонится, и он прилипнет.

###villagers and animals
taiga.actors.villager.name=селянин
taiga.actors.villager.desc=Один из жителей деревни, тепло укутанный от мороза.
taiga.actors.villager.line_1=Берегись волков за частоколом!
taiga.actors.villager.line_2=Говорят, шахта ведёт до самых демонических залов.
taiga.actors.villager.line_3=Погрейся у костра, ты совсем замёрз.
taiga.actors.villager.line_4=Охотница хорошо платит за волчьи шкуры.
taiga.actors.villager.line_5=Мой дед спустился в эту шахту. Больше его не видели.
taiga.actors.villager.line_6=Чай травницы лечит всё. Кроме глупости.
taiga.actors.villager.line_7=Ещё один искатель приключений? Удачи там, внизу.
taiga.actors.villager.line_8=Зайцы в этом году жирные.
taiga.actors.villager.line_9=Не корми хаски, он сегодня уже съел три рыбы.
taiga.actors.villager.line_10=Брр! Даже ручей замерзает.
taiga.actors.husky.name=хаски
taiga.actors.husky.desc=Пушистая ездовая собака с голубыми глазами и хвостом бубликом. Похоже, она любит всех.
taiga.actors.husky.line_1=Гав!
taiga.actors.husky.line_2=*виляет хвостом*
taiga.actors.husky.line_3=*обнюхивает вашу сумку в поисках рыбы*
taiga.actors.husky.line_4=Ау-у-у!
taiga.actors.reindeer.name=северный олень
taiga.actors.reindeer.desc=Ручной олень с колокольчиком на шее, разрывающий снег в поисках ягеля.
taiga.actors.reindeer.line_1=*жуёт ягель*
taiga.actors.reindeer.line_2=*фыркает облачком пара*
taiga.actors.reindeer.line_3=*звенит колокольчик*
taiga.actors.wolf.name=волк
taiga.actors.wolf.desc=Поджарый серый волк. Голод пригнал его к деревне, но за частокол он не пойдёт.
taiga.actors.snowhare.name=заяц-беляк
taiga.actors.snowhare.desc=Белый заяц, почти невидимый на снегу. Убегает от малейшего шороха.

###items
taiga.items.smokedfish.name=копчёная рыба
taiga.items.smokedfish.desc=Целый хариус, закопчённый на можжевельнике. Не полноценная еда, но вкусно.
taiga.items.pinenutbread.name=хлеб с кедровыми орехами
taiga.items.pinenutbread.desc=Плотная ржаная буханка с кедровыми орехами. Сытная, как паёк.
taiga.items.herbaltea.name=травяной чай
taiga.items.herbaltea.ac_drink=ВЫПИТЬ
taiga.items.herbaltea.drink_msg=Горячий чай согревает вас и унимает боль ран.
taiga.items.herbaltea.desc=Фляга горячего чая из шиповника, чабреца и ивовой коры. Понемногу лечит, прогоняет холод и немного утоляет голод.
taiga.items.wolfpelt.name=волчья шкура
taiga.items.wolfpelt.desc=Густая серая шкура. Её купит любой торговец в деревне.
taiga.items.pineresin.name=сосновая смола
taiga.items.pineresin.stuck=%s прилип к смоле!
taiga.items.pineresin.desc=Липкий янтарный комок сосновой смолы. Брошенный в существо, приклеивает его к земле на несколько ходов.
taiga.items.furcloak.name=меховой плащ
taiga.items.furcloak.desc=Тяжёлый плащ из волчьего меха поверх стёганой куртки. Защищает как кожаная броня, но носить его легче.
taiga.items.mittens.name=меховые рукавицы
taiga.items.mittens.desc=Стёганые рукавицы с подкладкой из кольчужных колец. Быстрые, как перчатки, и бьют чуть сильнее.

###the trail up and the taiga floors
taiga.taigatownlevel.trail_up_name=Старая тропа
taiga.taigatownlevel.trail_up_desc=Каменные ступени, отмеченные красными лентами, уходят вверх из поляны. Это Старая тропа: она ведёт в тайгу, к горам.
taiga.taigatownlevel.trail_down_name=Тропа вниз
taiga.taigatownlevel.trail_down_desc=Тропа петляет вниз по склону, обратно к деревне.
taiga.taigabranch.climbing=Подъём...
taiga.taigabranch.going_down=Спуск...
taiga.taigabranch.arrive=Вы поднимаетесь: %s.
taiga.taigabranch.return=Вы возвращаетесь: %s.
taiga.taigabranch.floor_1=Старая тропа
taiga.taigabranch.floor_2=Глухая тайга
taiga.taigabranch.floor_3=Ледяные озёра
taiga.taigabranch.floor_4=Холмы шаманки
taiga.taigabranch.floor_5=Роща Лешего
taiga.taigabranch.flavor_1=Тропа петляет вверх между древними елями. С тех пор как из подземелья поднялась тёмная энергия, зима здесь не кончается. Где-то впереди воют волки.
taiga.taigabranch.flavor_2=Лес смыкается вокруг вас. Где-то среди деревьев поднимается тонкий дымок костра.
taiga.taigabranch.flavor_3=Между деревьями блестят скованные льдом озёра. Говорят, здесь водит самую большую стаю тайги одноглазый волк.
taiga.taigabranch.flavor_4=С холмов на вас смотрят резные духовые столбы. Воздух гудит чем-то древним и злым.
taiga.taigabranch.flavor_5=Здешние деревья старше деревни, старше города внизу. Кажется, весь лес затаил дыхание.
taiga.levels.taigabosslevel.spruce_desc=Древняя ель, кора которой поросла мхом. Кажется, она на вас смотрит.

###beasts of the taiga
taiga.actors.frostwolf.name=морозный волк
taiga.actors.frostwolf.desc=Крупный бледный волк глухой тайги, шерсть покрыта инеем. Морозные волки охотятся стаями и больше не боятся людей.
taiga.actors.oneeyedalpha.name=Одноглазый вожак
taiga.actors.oneeyedalpha.desc=Вожак великой стаи тайги: огромный тёмный волк с одним слепым и одним горящим красным глазом. Охотники годами гонялись за ним.
taiga.actors.oneeyedalpha.notice=*вожак скалит клыки и рычит*
taiga.actors.oneeyedalpha.howl=*протяжный вой катится по лесу*
taiga.actors.wildboar.name=кабан
taiga.actors.wildboar.desc=Щетинистый кабан с пожелтевшими клыками. Заметив вас, он бросается в атаку вдвое быстрее обычного.
taiga.actors.icewisp.name=ледяной огонёк
taiga.actors.icewisp.desc=Маленький дух мороза, светящийся, как лунный свет на снегу. Бесконечная зима озлобила огоньков тайги. Плюётся осколками льда, которые замораживают цель.
taiga.actors.icewisp.bolt_kill=Ледяной осколок пронзил ваше сердце...
taiga.actors.frostbitten.name=обмороженный
taiga.actors.frostbitten.desc=Путник, замёрзший насмерть в тайге и вставший снова. С его бороды свисают сосульки, а прикосновение пробирает до костей.
taiga.actors.brownbear.name=бурый медведь
taiga.actors.brownbear.desc=Огромный бурый медведь, поднятый из зимней спячки бесконечным холодом. Он голоден и очень, очень зол. Лучше его не будить.
taiga.actors.sprucetreant.name=еловый древень
taiga.actors.sprucetreant.desc=Проснувшаяся ель, которая ходит. Её корни хватают всё, во что она бьёт.
taiga.actors.sprucetreant.disguise_name=ель
taiga.actors.sprucetreant.disguise_desc=Молодая ель гнётся под шапкой снега. Она тут стояла минуту назад?
taiga.actors.sprucetreant.awakens=Ель открывает янтарные глаза!
taiga.actors.whitestag.name=белый олень
taiga.actors.whitestag.desc=Олень с белоснежной шерстью и серебряными рогами. Деревенские говорят, что это посланник самого Лешего и что поймавший его станет быстрым, как ветер.
taiga.actors.goldensable.name=золотой соболь
taiga.actors.goldensable.desc=Соболь с мехом, будто из расплавленного золота. Его шкура стоит в деревне целое состояние, если только вы сумеете его поймать.
taiga.actors.corruptedtotem.name=осквернённый тотем
taiga.actors.corruptedtotem.desc=Резной духовой столб. Когда-то шаманы ставили их для защиты холмов, но гнев Лешего отравил их: пока рядом кто-то есть, тотем призывает ледяных огоньков.
taiga.actors.corruptedtotem.summon=призыв
taiga.actors.corruptedtotem.broken=Тотем раскалывается, и холодный дух вырывается на свободу. (сломано тотемов: %1$d из %2$d)

###the Leshy
taiga.actors.leshy.name=Леший
taiga.actors.leshy.desc=Хозяин тайги: великан из дерева и мха, увенчанный рогами, с горящими зелёными глазами. Веками он хранил равновесие леса. Тёмная энергия из подземелья свела его с ума, и теперь он обращает всю тайгу против каждого, кто в ней ходит.
taiga.actors.leshy.notice=КТО ХОДИТ В МОЕЙ РОЩЕ? Лес помнит каждый топор... и каждый шаг!
taiga.actors.leshy.roots_warn=Земля вокруг вас начинает шевелиться!
taiga.actors.leshy.roots_kill=Вас разорвали корни тайги...
taiga.actors.leshy.tree_warn=Древняя ель скрипит и начинает падать!
taiga.actors.leshy.tree_kill=Вас раздавила упавшая ель...
taiga.actors.leshy.step=Леший входит в одну ель и выходит из другой!
taiga.actors.leshy.howl=Ко мне, мои волки!
taiga.actors.leshy.phase2=Тогда пусть тебя заберёт зима! Проснитесь, дети мои!
taiga.actors.leshy.defeated=Лес... тебя... запомнит...

###quest givers
taiga.actors.trapper.name=старый охотник
taiga.actors.trapper.desc=Седой охотник в шапке-ушанке греет руки у небольшого костра. На поясе висят моток верёвки и несколько ржавых капканов.
taiga.actors.trapper.intro=Надо же, лицо, а не волчья морда. Садись, садись.\n\nСорок зим я ставлю капканы в этой тайге, но эта зима неправильная. Она не кончается. А волки... у ледяных озёр завелась стая, и водит её одноглазый зверюга размером с пони. Он забрал мои капканы, мою собаку и чуть не забрал меня.\n\nУбей Одноглазого вожака и принеси мне его клык. Я слишком стар для этого, но в долгу не останусь.
taiga.actors.trapper.reminder=Одноглазый вожак рыщет у ледяных озёр, выше по тропе. Принеси мне его клык.
taiga.actors.trapper.reward=Ты сделал это! Это его клык, точно. Вот, выбирай, эти вещи мне хорошо послужили.
taiga.actors.trapper.thanks=Пусть тайга будет к тебе добра, друг.
taiga.actors.trapper.farewell=Без вожака стая разбежалась. Сегодня я буду спать спокойно, благодаря тебе. Берегись Лешего выше по тропе... говорят, он обезумел.
taiga.actors.shaman.name=старая шаманка
taiga.actors.shaman.desc=Старушка, закутанная в красную одежду, расшитую бусинами и колокольчиками, с рогатым убором на белых волосах. Её глаза спокойны, но очень усталы.
taiga.actors.shaman.intro=Я видела тебя в дыму, дитя глубин.\n\nЛеший, хозяин этого леса, потерял разум от тьмы, что поднимается снизу. Его гнев отравил даже наши духовые столбы: на этих холмах стоят три осквернённых тотема и призывают духов мороза против живых.\n\nСломай три тотема и освободи запертых в них духов. Потом возвращайся к моему костру.
taiga.actors.shaman.reminder=Духи всё ещё в плену. Сломано тотемов: %1$d из %2$d.
taiga.actors.shaman.reward=Духи свободны, я чувствую, как они танцуют на ветру. Выбери дар, дитя; духи хотели, чтобы у тебя было что-то из этого.
taiga.actors.shaman.thanks=Иди с духами.
taiga.actors.shaman.farewell=На холмах стало тише. Остался только Леший, в своей роще на вершине тропы. Успокой его, если сможешь... а если нет, прекрати его страдания.

###items of the taiga floors
taiga.items.frostjavelin.name=морозный дротик
taiga.items.frostjavelin.desc=Лёгкий дротик с наконечником из промёрзшего железа работы старого охотника. Замораживает всё, во что попадает.
taiga.items.trapperknife.name=нож охотника
taiga.items.trapperknife.desc=Широкий нож для свежевания старого охотника. Наносит в полтора раза больше урона зверям тайги.
taiga.items.bearskincoat.name=медвежья шуба
taiga.items.bearskincoat.desc=Длинная шуба из густого медвежьего меха. Защищает как кольчуга, но носить её немного легче.
taiga.items.bearclaw.name=медвежий коготь
taiga.items.bearclaw.desc=Перчатка с медвежьими когтями. Быстрая, как сай, а раны от неё часто продолжают кровоточить.
taiga.items.woodcutteraxe.name=топор лесоруба
taiga.items.woodcutteraxe.desc=Тяжёлый ухоженный топор. Его хозяин давно замёрз в тайге, но лезвие острое как прежде и глубоко врубается в живое дерево.
taiga.items.spiritstaff.name=посох духов
taiga.items.spiritstaff.desc=Посох шаманки с колокольчиками, бусинами и маленькими косточками. Его удары несут холод духов и часто замораживают цель.
taiga.items.leshycrook.name=клюка Лешего
taiga.items.leshycrook.desc=Клюка хозяина тайги, всё ещё живая и пускающая зелёные побеги. Бьёт издалека, а корни часто хватают цель.
taiga.items.heartofthetaiga.name=Сердце тайги
taiga.items.heartofthetaiga.ac_absorb=ПОГЛОТИТЬ
taiga.items.heartofthetaiga.absorb_msg=Тепло всего леса наполняет вас.
taiga.items.heartofthetaiga.status=+%d макс. здоровья
taiga.items.heartofthetaiga.desc=Сердце Лешего: кусок светящегося янтаря с зелёным огнём внутри. Поглотив его, вы получите _+10 к максимальному здоровью_ навсегда.
taiga.items.elixirofthestag.name=эликсир оленя
taiga.items.elixirofthestag.drink_msg=Вы чувствуете себя быстрым и лёгким, как олень.
taiga.items.elixirofthestag.desc=Мерцающее серебристое питьё, оставленное белым оленем. Ненадолго делает вас очень быстрым и надолго дарует благословение.
taiga.items.elixirofthenorth.name=эликсир севера
taiga.items.elixirofthenorth.drink_msg=По телу разливается тёплое сияние.
taiga.items.elixirofthenorth.desc=Отвар шаманки из морошки, коры и дыма духов. Постепенно лечит и надолго прогоняет холод: вас нельзя заморозить или охладить.
taiga.items.elixirofthenorth$frostward.name=Тепло севера
taiga.items.elixirofthenorth$frostward.desc=Эликсир шаманки согревает вас: вас нельзя охладить или заморозить.\n\nОсталось ходов: %s.
taiga.items.alphafang.name=клык вожака
taiga.items.alphafang.desc=Огромный пожелтевший клык Одноглазого вожака. Старый охотник захочет его увидеть.
taiga.items.bearpelt.name=медвежья шкура
taiga.items.bearpelt.desc=Густая шкура бурого медведя. Торговцы в деревне хорошо за неё платят.
taiga.items.sablepelt.name=шкура золотого соболя
taiga.items.sablepelt.desc=Мягкая мерцающая шкура золотого соболя. Стоит в деревне целое состояние.
