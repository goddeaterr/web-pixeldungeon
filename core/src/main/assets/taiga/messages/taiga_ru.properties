###MOD (taiga town): тексты таёжной деревни на этаже 0

###level
taiga.taigatownlevel.arrive=Вы выбираетесь из шахты на морозный воздух деревни.
taiga.taigatownlevel.amulet_title=Путь наверх
taiga.taigatownlevel.amulet_body=В шахту падает дневной свет. С Амулетом Йендора в сумке можно навсегда покинуть подземелье... или сначала заглянуть в деревню.
taiga.taigatownlevel.amulet_leave=Покинуть подземелье (конец игры)
taiga.taigatownlevel.amulet_village=Зайти в деревню
taiga.taigatownlevel.forest_name=Густая тайга
taiga.taigatownlevel.forest_desc=Заснеженные ели стоят так плотно, что между ними никому не протиснуться.
taiga.taigatownlevel.logs_name=Бревенчатая стена
taiga.taigatownlevel.logs_desc=Толстые сосновые брёвна, срубленные в угол и проконопаченные мхом. За заиндевевшими окнами горит тёплый свет.
taiga.taigatownlevel.palisade_name=Частокол
taiga.taigatownlevel.palisade_desc=Стена из заострённых кольев не пускает волков в деревню.
taiga.taigatownlevel.spruce_name=Ель
taiga.taigatownlevel.spruce_desc=Молодая ель гнётся под шапкой свежего снега.
taiga.taigatownlevel.festive_spruce_name=Нарядная ель
taiga.taigatownlevel.festive_spruce_desc=Деревенские украсили эту ель расписными шишками и соломенной звездой.
taiga.taigatownlevel.woodpile_name=Поленница
taiga.taigatownlevel.woodpile_desc=Колотые берёзовые и сосновые дрова, сложенные на долгую зиму.
taiga.taigatownlevel.campfire_name=Костёр
taiga.taigatownlevel.campfire_desc=Потрескивающий костёр в кольце из камней. По вечерам здесь собирается вся деревня.
taiga.taigatownlevel.stream_name=Ледяной ручей
taiga.taigatownlevel.stream_desc=Тёмная вода бежит между снежными берегами, неся тонкие льдинки.
taiga.taigatownlevel.snow_name=Снег
taiga.taigatownlevel.snow_desc=По снегу разбросаны ветки, шишки и следы мелких зверьков.
taiga.taigatownlevel.grass_name=Сухая трава
taiga.taigatownlevel.grass_desc=Из-под снега торчит прошлогодняя трава.
taiga.taigatownlevel.shrubs_name=Заснеженные кусты
taiga.taigatownlevel.shrubs_desc=Можжевельник, засыпанный снегом. В нём легко спрятаться.
taiga.taigatownlevel.trampled_name=Примятые кусты
taiga.taigatownlevel.planks_name=Дощатый пол
taiga.taigatownlevel.shaft_name=Шахта
taiga.taigatownlevel.shaft_desc=Лестница ведёт вниз, в старую шахту, а шахта ведёт в подземелье.
taiga.taigatownlevel.cauldron_name=Котёл травницы
taiga.taigatownlevel.cauldron_desc=Большой чугунный котёл с бурлящим зелёным варевом. Травница разрешает всем пользоваться им для алхимии.

###traders
taiga.actors.towntrader.warn=Эй! Ведите себя прилично, у нас мирная деревня.
taiga.actors.furtrader.name=торговец мехами
taiga.actors.furtrader.desc=Здоровяк, укутанный в меха от шапки до сапог. Торгует тёплой одеждой и всем снаряжением, которое приносят снизу искатели приключений.
taiga.actors.furtrader.talk=Холодно там внизу? Ещё бы. Никто не лезет в эту шахту без доброго плаща на плечах. Лучше моих мехов на этом берегу не найдёшь, а за всё, что вытащишь наверх, дам честную цену.
taiga.actors.herbalist.name=травница
taiga.actors.herbalist.desc=Старушка в зелёной шали, пахнущая мятой и дымом. Вся её изба увешана пучками сушёных трав.
taiga.actors.herbalist.talk=Присядь, милок, выпей чаю. Ивовая кора от боли, шиповник от простуды... А если найдёшь что-то растущее в той яме, неси мне. Котёл в твоём распоряжении.
taiga.actors.hunter.name=охотница
taiga.actors.hunter.desc=Молчаливая женщина в сером капюшоне, с колчаном за спиной. Она оценивает вас взглядом, как оленя.
taiga.actors.hunter.talk=Волки нынче осмелели. Принеси мне их шкуры, я заплачу. И кстати, смола творит чудеса: брось комок в того, кто за тобой гонится, и он прилипнет.

###villagers and animals
taiga.actors.villager.name=селянин
taiga.actors.villager.desc=Один из жителей деревни, тепло укутанный от мороза.
taiga.actors.villager.line_1=Берегись волков за частоколом!
taiga.actors.villager.line_2=Говорят, шахта ведёт до самых демонических залов.
taiga.actors.villager.line_3=Погрейся у костра, ты совсем замёрз.
taiga.actors.villager.line_4=Охотница хорошо платит за волчьи шкуры.
taiga.actors.villager.line_5=Мой дед спустился в эту шахту. Больше его не видели.
taiga.actors.villager.line_6=Чай травницы лечит всё. Кроме глупости.
taiga.actors.villager.line_7=Ещё один искатель приключений? Удачи там, внизу.
taiga.actors.villager.line_8=Зайцы в этом году жирные.
taiga.actors.villager.line_9=Не корми хаски, он сегодня уже съел три рыбы.
taiga.actors.villager.line_10=Брр! Даже ручей замерзает.
taiga.actors.husky.name=хаски
taiga.actors.husky.desc=Пушистая ездовая собака с голубыми глазами и хвостом бубликом. Похоже, она любит всех.
taiga.actors.husky.line_1=Гав!
taiga.actors.husky.line_2=*виляет хвостом*
taiga.actors.husky.line_3=*обнюхивает вашу сумку в поисках рыбы*
taiga.actors.husky.line_4=Ау-у-у!
taiga.actors.reindeer.name=северный олень
taiga.actors.reindeer.desc=Ручной олень с колокольчиком на шее, разрывающий снег в поисках ягеля.
taiga.actors.reindeer.line_1=*жуёт ягель*
taiga.actors.reindeer.line_2=*фыркает облачком пара*
taiga.actors.reindeer.line_3=*звенит колокольчик*
taiga.actors.wolf.name=волк
taiga.actors.wolf.desc=Поджарый серый волк. Голод пригнал его к деревне, но за частокол он не пойдёт.
taiga.actors.snowhare.name=заяц-беляк
taiga.actors.snowhare.desc=Белый заяц, почти невидимый на снегу. Убегает от малейшего шороха.

###items
taiga.items.smokedfish.name=копчёная рыба
taiga.items.smokedfish.desc=Целый хариус, закопчённый на можжевельнике. Не полноценная еда, но вкусно.
taiga.items.pinenutbread.name=хлеб с кедровыми орехами
taiga.items.pinenutbread.desc=Плотная ржаная буханка с кедровыми орехами. Сытная, как паёк.
taiga.items.herbaltea.name=травяной чай
taiga.items.herbaltea.ac_drink=ВЫПИТЬ
taiga.items.herbaltea.drink_msg=Горячий чай согревает вас и унимает боль ран.
taiga.items.herbaltea.desc=Фляга горячего чая из шиповника, чабреца и ивовой коры. Понемногу лечит, прогоняет холод и немного утоляет голод.
taiga.items.wolfpelt.name=волчья шкура
taiga.items.wolfpelt.desc=Густая серая шкура. Её купит любой торговец в деревне.
taiga.items.pineresin.name=сосновая смола
taiga.items.pineresin.stuck=%s прилип к смоле!
taiga.items.pineresin.desc=Липкий янтарный комок сосновой смолы. Брошенный в существо, приклеивает его к земле на несколько ходов.
taiga.items.furcloak.name=меховой плащ
taiga.items.furcloak.desc=Тяжёлый плащ из волчьего меха поверх стёганой куртки. Защищает как кожаная броня, но носить его легче.
taiga.items.mittens.name=меховые рукавицы
taiga.items.mittens.desc=Стёганые рукавицы с подкладкой из кольчужных колец. Быстрые, как перчатки, и бьют чуть сильнее.
